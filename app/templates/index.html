<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealEstate AI Assistant — DarGlobal &amp; Wasalt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════
       Reset & Variables
    ═══════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --card:      #12121a;
      --card2:     #1a1a26;
      --border:    #2a2a3d;
      --gold:      #d4a853;
      --gold-dim:  #a07a35;
      --gold-glow: rgba(212,168,83,0.18);
      --gold-bg:   rgba(212,168,83,0.08);
      --text:      #e8e8f0;
      --text-muted:#8888aa;
      --user-bg:   linear-gradient(135deg,#c49535,#d4a853);
      --ai-bg:     #1a1a26;
      --radius:    16px;
      --radius-sm: 8px;
      --shadow:    0 8px 32px rgba(0,0,0,0.6);
      --transition:0.2s ease;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════════════
       Layout Shell
    ═══════════════════════════════════════════════════ */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    /* ═══════════════════════════════════════════════════
       Header
    ═══════════════════════════════════════════════════ */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .logo-ring {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: var(--gold-bg);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 16px var(--gold-glow);
    }

    .logo-ring svg { width: 24px; height: 24px; fill: var(--gold); }

    .header-text { flex: 1; }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 400;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,200,120,0.1);
      border: 1px solid rgba(0,200,120,0.25);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.7rem;
      color: #4ade80;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse-green 2s infinite;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ═══════════════════════════════════════════════════
       Chat Container
    ═══════════════════════════════════════════════════ */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ═══════════════════════════════════════════════════
       Message Bubbles
    ═══════════════════════════════════════════════════ */
    .msg-row {
      display: flex;
      gap: 10px;
      animation: fadeSlideIn 0.3s ease;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user  { flex-direction: row-reverse; }
    .msg-row.ai    { flex-direction: row; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .avatar.ai-av {
      background: var(--gold-bg);
      border: 1.5px solid var(--gold);
      color: var(--gold);
      font-size: 1rem;
    }

    .avatar.user-av {
      background: linear-gradient(135deg, #c49535, #d4a853);
      color: #0a0a0f;
      font-weight: 700;
    }

    .bubble-wrap { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
    .msg-row.user .bubble-wrap { align-items: flex-end; }
    .msg-row.ai   .bubble-wrap { align-items: flex-start; }

    .bubble {
      padding: 13px 17px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.9rem;
      position: relative;
      word-break: break-word;
    }

    .msg-row.user .bubble {
      background: var(--user-bg);
      color: #0a0a0f;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }

    .msg-row.ai .bubble {
      background: var(--ai-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .timestamp {
      font-size: 0.65rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    /* ─── Source Badges ───────────────────────────────── */
    .sources-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--gold-bg);
      border: 1px solid rgba(212,168,83,0.3);
      color: var(--gold);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.65rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition), border-color var(--transition);
      letter-spacing: 0.3px;
    }

    .source-badge:hover {
      background: rgba(212,168,83,0.18);
      border-color: var(--gold);
    }

    .source-badge svg { width: 10px; height: 10px; fill: var(--gold); flex-shrink: 0; }

    /* ─── Intent tag ─────────────────────────────────── */
    .intent-tag {
      display: inline-block;
      background: rgba(100,100,200,0.12);
      border: 1px solid rgba(100,100,200,0.25);
      color: #aaa0ff;
      border-radius: 12px;
      padding: 2px 9px;
      font-size: 0.62rem;
      font-weight: 500;
      margin-top: 5px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ═══════════════════════════════════════════════════
       Typing Indicator
    ═══════════════════════════════════════════════════ */
    .typing-row { display: none; }
    .typing-row.visible { display: flex; }

    .typing-bubble {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--gold);
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ═══════════════════════════════════════════════════
       Suggested Questions
    ═══════════════════════════════════════════════════ */
    .suggestions {
      padding: 8px 20px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    .suggestions-label {
      width: 100%;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), color var(--transition);
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--gold-dim);
      background: var(--gold-bg);
      color: var(--gold);
    }

    .chip-icon { font-size: 0.85rem; }

    /* ═══════════════════════════════════════════════════
       Input Bar
    ═══════════════════════════════════════════════════ */
    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 14px 20px 18px;
      background: var(--card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .textarea-wrap {
      flex: 1;
      position: relative;
    }

    #userInput {
      width: 100%;
      resize: none;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
    }

    #userInput::placeholder { color: var(--text-muted); }

    #userInput:focus {
      border-color: var(--gold-dim);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .send-btn {
      width: 46px; height: 46px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #c49535, #d4a853);
      color: #0a0a0f;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(212,168,83,0.3);
    }

    .send-btn:hover { opacity: 0.9; transform: scale(1.04); box-shadow: 0 6px 20px rgba(212,168,83,0.4); }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 20px; height: 20px; fill: #0a0a0f; }

    /* ═══════════════════════════════════════════════════
       Session info footer
    ═══════════════════════════════════════════════════ */
    .session-info {
      text-align: center;
      font-size: 0.6rem;
      color: rgba(136,136,170,0.4);
      padding-bottom: 4px;
      letter-spacing: 0.5px;
    }

    /* ═══════════════════════════════════════════════════
       Decorative gold divider
    ═══════════════════════════════════════════════════ */
    .gold-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      flex-shrink: 0;
      opacity: 0.6;
    }

    /* ═══════════════════════════════════════════════════
       Responsive
    ═══════════════════════════════════════════════════ */
    @media (max-width: 600px) {
      .header-title { font-size: 1.1rem; }
      .bubble-wrap  { max-width: 88%; }
      .chip         { font-size: 0.7rem; padding: 5px 10px; }
      .suggestions  { gap: 6px; }
    }
  </style>
</head>

<body>
<div class="shell">

  <!-- ── Header ─────────────────────────────────────── -->
  <header>
    <div class="logo-ring">
      <!-- Building / Property icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 21V9l9-6 9 6v12H3zm2-2h4v-4H5v4zm6 0h4v-4h-4v4zm6 0h2v-8.27L12 5.1 5 10.73V19h2v-4h2v4h2v-4h2v4z"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="header-title">RealEstate AI Assistant</div>
      <div class="header-subtitle">Powered by DarGlobal &amp; Wasalt</div>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      Online
    </div>
  </header>

  <div class="gold-line"></div>

  <!-- ── Chat Area ──────────────────────────────────── -->
  <div class="chat-area" id="chatArea">
    <!-- Messages injected by JS -->
  </div>

  <!-- ── Typing Indicator ───────────────────────────── -->
  <div class="msg-row ai typing-row" id="typingRow" style="padding: 0 20px 4px;">
    <div class="avatar ai-av">🏛</div>
    <div class="typing-bubble">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <!-- ── Suggested Questions ───────────────────────── -->
  <div class="suggestions" id="suggestionsBar">
    <div class="suggestions-label">Suggested questions</div>
    <button class="chip" onclick="sendSuggestion(this)">
      <span class="chip-icon">🏙</span>Tell me about DarGlobal projects
    </button>
    <button class="chip" onclick="sendSuggestion(this)">
      <span class="chip-icon">🌆</span>Properties in Dubai
    </button>
    <button class="chip" onclick="sendSuggestion(this)">
      <span class="chip-icon">🕌</span>Wasalt listings in Riyadh
    </button>
    <button class="chip" onclick="sendSuggestion(this)">
      <span class="chip-icon">✨</span>Luxury apartments
    </button>
  </div>

  <!-- ── Input Bar ──────────────────────────────────── -->
  <div class="input-bar">
    <div class="textarea-wrap">
      <textarea
        id="userInput"
        rows="1"
        placeholder="Ask about properties, projects, pricing…"
        aria-label="Your message"
      ></textarea>
    </div>
    <button class="send-btn" id="sendBtn" title="Send" onclick="sendMessage()">
      <!-- Send / paper-plane icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

  <div class="session-info" id="sessionInfo"></div>

</div><!-- /shell -->

<script>
/* ═══════════════════════════════════════════════════════════════════
   Session Management
═══════════════════════════════════════════════════════════════════ */
function uuidv4() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

const SESSION_KEY = 'proptech_session_id';
let sessionId = localStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = uuidv4();
  localStorage.setItem(SESSION_KEY, sessionId);
}

document.getElementById('sessionInfo').textContent = `Session: ${sessionId.slice(0, 8)}…`;

/* ═══════════════════════════════════════════════════════════════════
   DOM References
═══════════════════════════════════════════════════════════════════ */
const chatArea   = document.getElementById('chatArea');
const userInput  = document.getElementById('userInput');
const sendBtn    = document.getElementById('sendBtn');
const typingRow  = document.getElementById('typingRow');

/* ═══════════════════════════════════════════════════════════════════
   Auto-resize textarea
═══════════════════════════════════════════════════════════════════ */
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
});

/* ═══════════════════════════════════════════════════════════════════
   Keyboard: Enter sends, Shift+Enter = newline
═══════════════════════════════════════════════════════════════════ */
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

/* ═══════════════════════════════════════════════════════════════════
   Helpers
═══════════════════════════════════════════════════════════════════ */
function formatTime(d) {
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function scrollToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* Convert basic markdown-ish patterns to HTML */
function formatText(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,   '<em>$1</em>')
    .replace(/\n/g, '<br/>');
}

/* ═══════════════════════════════════════════════════════════════════
   Render message bubble
═══════════════════════════════════════════════════════════════════ */
function appendMessage({ role, text, sources = [], intent = null }) {
  const isUser = role === 'user';
  const now    = formatTime(new Date());

  /* Build sources HTML */
  let sourcesHtml = '';
  if (!isUser && sources && sources.length > 0) {
    const badges = sources.map(src => {
      const url   = typeof src === 'string' ? src : (src.url || src.source || '#');
      const label = typeof src === 'string'
        ? src.replace(/^https?:\/\//, '').split('/')[0]
        : (src.title || src.url || 'Source').replace(/^https?:\/\//, '').split('/')[0];
      return `<a class="source-badge" href="${escapeHtml(url)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zM5 5a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-5h-2v5H5V7h5V5H5z"/></svg>
        ${escapeHtml(label)}
      </a>`;
    }).join('');
    sourcesHtml = `<div class="sources-wrap">${badges}</div>`;
  }

  /* Intent tag */
  let intentHtml = '';
  if (!isUser && intent && intent !== 'general') {
    intentHtml = `<span class="intent-tag">${escapeHtml(intent)}</span>`;
  }

  const html = `
    <div class="msg-row ${isUser ? 'user' : 'ai'}">
      <div class="avatar ${isUser ? 'user-av' : 'ai-av'}">${isUser ? 'You' : '🏛'}</div>
      <div class="bubble-wrap">
        <div class="bubble">${formatText(text)}</div>
        ${sourcesHtml}
        ${intentHtml}
        <span class="timestamp">${now}</span>
      </div>
    </div>`;

  chatArea.insertAdjacentHTML('beforeend', html);
  scrollToBottom();
}

/* ═══════════════════════════════════════════════════════════════════
   Typing indicator
═══════════════════════════════════════════════════════════════════ */
function showTyping()  {
  typingRow.classList.add('visible');
  chatArea.appendChild(typingRow); /* move to end */
  scrollToBottom();
}
function hideTyping()  { typingRow.classList.remove('visible'); }

/* ═══════════════════════════════════════════════════════════════════
   Send Message
═══════════════════════════════════════════════════════════════════ */
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || sendBtn.disabled) return;

  /* Reset input */
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;

  /* Show user bubble */
  appendMessage({ role: 'user', text });

  /* Show typing */
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    hideTyping();

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    appendMessage({
      role:    'ai',
      text:    data.response   || '(No response)',
      sources: data.sources    || [],
      intent:  data.intent     || 'general',
    });

  } catch (err) {
    hideTyping();
    appendMessage({
      role: 'ai',
      text: `⚠️ **Error:** ${err.message}\n\nPlease check that the backend is running and try again.`,
    });
  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Suggested Questions
═══════════════════════════════════════════════════════════════════ */
function sendSuggestion(btn) {
  userInput.value = btn.textContent.trim();
  sendMessage();
}

/* ═══════════════════════════════════════════════════════════════════
   Welcome Message (on page load)
═══════════════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  appendMessage({
    role: 'ai',
    text: "Welcome! I'm your RealEstate AI Assistant. I can help you explore DarGlobal's luxury properties worldwide and Wasalt's real estate listings in Saudi Arabia. How can I assist you today?",
  });
  userInput.focus();
});
</script>
</body>
</html>

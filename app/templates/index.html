<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DarGlobal &amp; Wasalt | PropTech AI Advisor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #1e1b16;
      --cream-dark: #17140f;
      --sidebar-bg: #111009;
      --sidebar-border: #2a2520;
      --sidebar-hover: #1c1812;
      --text-on-dark:  #d4c9b5;
      --text-muted-dark: #6a6054;
      --main-bg:    #16130e;
      --card-bg:    #1e1b16;
      --border-light: #2e2920;
      --text-dark:  #e2d9c8;
      --text-mid:   #9e9080;
      --text-light: #6a6054;
      --gold:       #c9a84c;
      --gold-light: #e8d49a;
      --gold-hover: #b8942e;
      --teal:       #3d9e8e;
      --teal-light: #1a3330;
      --rose:       #c0574b;
      --slate:      #4a5568;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans:  'Inter', system-ui, sans-serif;
      --radius:     12px;
      --radius-sm:  8px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-sans);
      background: var(--main-bg);
      color: var(--text-dark);
      display: flex;
    }

    /* ── Sidebar ─────────────────────────────────── */
    aside {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--sidebar-border);
    }

    .sidebar-top {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--sidebar-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #c9a84c 0%, #8b6914 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-mark svg { width: 18px; height: 18px; fill: #fff; }

    .brand-text h1 {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: #e8dcc8;
      letter-spacing: 0.3px;
    }

    .brand-text span {
      font-size: 10px;
      color: var(--text-muted-dark);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .new-chat-btn {
      width: 100%;
      padding: 9px 14px;
      background: transparent;
      border: 1px solid var(--sidebar-border);
      border-radius: var(--radius-sm);
      color: var(--text-on-dark);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
    }

    .new-chat-btn:hover {
      background: var(--sidebar-hover);
      border-color: #3e3830;
    }

    .new-chat-btn svg { width: 14px; height: 14px; opacity: 0.7; }

    .history-label {
      padding: 14px 16px 6px;
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted-dark);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .history-list::-webkit-scrollbar { width: 3px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: #3a342c; border-radius: 4px; }

    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.12s;
      margin-bottom: 1px;
    }

    .history-item:hover { background: var(--sidebar-hover); }

    .history-item .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-muted-dark);
      margin-top: 6px;
      flex-shrink: 0;
    }

    .history-item .hist-text {
      flex: 1;
      min-width: 0;
    }

    .history-item .hist-q {
      font-size: 12.5px;
      color: #c0b49c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }

    .history-item .hist-time {
      font-size: 10px;
      color: var(--text-muted-dark);
      margin-top: 2px;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--sidebar-border);
      font-size: 10px;
      color: var(--text-muted-dark);
      letter-spacing: 0.3px;
    }

    /* ── Main Area ───────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--main-bg);
    }

    /* Top bar */
    .topbar {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border-light);
      background: var(--sidebar-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-title {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-on-dark);
    }

    .topbar-badge {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 500;
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.1);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 12px;
      padding: 2px 9px;
      letter-spacing: 0.2px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .topbar-clear {
      background: none;
      border: 1px solid var(--sidebar-border);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-size: 11px;
      color: var(--text-muted-dark);
      cursor: pointer;
      transition: background 0.12s;
    }

    .topbar-clear:hover { background: var(--sidebar-hover); }

    /* Chat container */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

    /* Welcome Screen */
    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 24px;
      text-align: center;
    }

    .welcome-icon-wrap {
      margin-bottom: 24px;
      position: relative;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(145deg, #2a2318 0%, #1e1a0f 100%);
      border: 1.5px solid #3a3020;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-icon svg { width: 30px; height: 30px; }

    .welcome-screen h2 {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 500;
      color: var(--text-dark);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .welcome-screen p {
      font-size: 14px;
      color: var(--text-mid);
      max-width: 420px;
      line-height: 1.65;
      margin-bottom: 36px;
    }

    /* Suggestion chips */
    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 820px;
    }

    @media (max-width: 680px) {
      .suggestions {
        grid-template-columns: 1fr;
      }
    }

    .chip {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      font-family: var(--font-sans);
    }

    .chip:hover {
      border-color: var(--gold);
      box-shadow: 0 2px 10px rgba(201,168,76,0.12);
      background: #231f18;
    }

    .chip-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }

    .chip-icon.green  { background: #133826; border: 1px solid #226142; }
    .chip-icon.gold   { background: #2a2010; border: 1px solid #4a381c; }
    .chip-icon.teal   { background: #15363b; border: 1px solid #245860; }
    .chip-icon.slate  { background: #1e2230; border: 1px solid #333a52; }
    .chip-icon.rose   { background: #2a1510; border: 1px solid #4a241c; }

    .chip-query {
      font-size: 12.5px;
      color: var(--text-dark);
      font-weight: 500;
      line-height: 1.4;
      flex: 1;
    }

    /* Messages */
    .messages-wrap {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .msg-row.bot .msg-avatar {
      background: linear-gradient(135deg, #c9a84c, #8b6914);
      color: #ffffff;
    }

    .msg-bubble {
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: 13.5px;
      line-height: 1.65;
    }

    .msg-row.bot  .msg-bubble {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      color: var(--text-dark);
      border-top-left-radius: 4px;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #c9a84c, #b38f36);
      color: #120e06;
      font-weight: 500;
      border-top-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-light);
      margin-top: 4px;
      text-align: right;
    }

    .msg-row.bot .msg-time { text-align: left; }

    /* Sources (clean text with PDF name and page, no oval pills) */
    .source-citation {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
      font-size: 11.5px;
      color: var(--text-light);
      line-height: 1.6;
    }

    .source-hdr {
      font-weight: 600;
      color: #c9a84c;
      margin-right: 6px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.6px;
    }

    .source-doc {
      color: #e2d9c8;
      font-weight: 500;
    }

    .source-page {
      color: #9e9080;
      margin-left: 2px;
      margin-right: 4px;
    }

    /* Recommended follow-up questions section */
    .followup-container {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }

    .followup-header {
      font-size: 10.5px;
      font-weight: 600;
      color: #9e9080;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 2px;
    }

    .followup-header svg {
      width: 12px;
      height: 12px;
      fill: #c9a84c;
    }

    .followup-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .followup-chip {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 9px 14px;
      color: #d4c9b5;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .followup-chip:hover {
      background: #252018;
      border-color: #c9a84c;
      color: #f3e5be;
    }

    /* 3 Floating Dots Loader */
    .typing-bubble {
      padding: 12px 18px !important;
      display: inline-flex !important;
      align-items: center !important;
      width: fit-content !important;
      background: var(--card-bg) !important;
      border: 1px solid var(--border-light) !important;
      border-top-left-radius: 4px !important;
    }

    .typing-indicator {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      height: 16px;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c9a84c;
      display: inline-block;
      animation: floatDot 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes floatDot {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      50% {
        transform: translateY(-7px);
        opacity: 1;
      }
    }

    /* Input area */
    .input-area {
      padding: 14px 20px 18px;
      background: var(--main-bg);
      border-top: 1px solid var(--border-light);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-light);
      border-radius: 14px;
      padding: 8px 12px 8px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
    }

    .input-row:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
    }

    #user-input {
      flex: 1;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text-dark);
      line-height: 22px;
      max-height: 120px;
      min-height: 22px;
      padding: 4px 0;
      margin: 0;
      display: block;
    }

    #user-input::placeholder { color: var(--text-light); }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--sidebar-bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover { background: #2e2820; }
    .send-btn svg { width: 16px; height: 16px; fill: #d4c09a; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .input-hint {
      text-align: center;
      font-size: 10.5px;
      color: var(--text-light);
      margin-top: 8px;
      letter-spacing: 0.2px;
    }

    /* Utility */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ── Sidebar ───────────────────────────────────── -->
<aside>
  <div class="sidebar-top">
    <div class="brand">
      <div class="brand-mark" style="background: linear-gradient(135deg, #2a2215, #1a160e); border: 1px solid #c9a84c;">
        <!-- geometric luxury crest -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#c9a84c">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>DarGlobal AI</h1>
        <span>PropTech Advisor</span>
      </div>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      New conversation
    </button>
  </div>

  <div class="history-label">Recent</div>

  <div class="history-list" id="history-list">
    <!-- populated by JS -->
  </div>

  <div class="sidebar-footer">
    Powered by RAG · Free OpenRouter Models
  </div>
</aside>

<!-- ── Main ──────────────────────────────────────── -->
<main>
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">DarGlobal &amp; Wasalt AI Advisor</span>
      <span class="topbar-badge">● Live Knowledge Base</span>
    </div>
    <button class="topbar-clear" onclick="clearChat()">Clear chat</button>
  </div>

  <div class="chat-area" id="chat-area">

    <!-- Welcome screen (shown when no messages) -->
    <div class="welcome-screen" id="welcome-screen">

      <div class="welcome-icon-wrap">
        <div class="welcome-icon">
          <!-- keys icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#c9a84c">
            <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
          </svg>
        </div>
      </div>

      <h2>DarGlobal &amp; Wasalt Intelligence</h2>
      <p>Explore DarGlobal luxury residences and Wasalt property listings &amp; auctions.</p>

      <div class="suggestions" id="suggestions">

        <button class="chip" onclick="submitSuggestion('What luxury projects does DarGlobal have in Dubai?')">
          <span class="chip-icon green">🏙️</span>
          <span class="chip-query">What luxury projects does DarGlobal have in Dubai?</span>
        </button>

        <button class="chip" onclick="submitSuggestion('What branded residences does DarGlobal offer in collaboration with Pagani?')">
          <span class="chip-icon green">🏎️</span>
          <span class="chip-query">What branded residences does DarGlobal offer in collaboration with Pagani?</span>
        </button>

        <button class="chip" onclick="submitSuggestion('What residential properties are available on Wasalt in Saudi Arabia?')">
          <span class="chip-icon teal">🗺️</span>
          <span class="chip-query">What residential properties are available on Wasalt in Saudi Arabia?</span>
        </button>

        <button class="chip" onclick="submitSuggestion('What real estate auction services are hosted on Wasalt in Saudi Arabia?')">
          <span class="chip-icon teal">⚖️</span>
          <span class="chip-query">What real estate auction services are hosted on Wasalt in Saudi Arabia?</span>
        </button>

      </div>
    </div>

    <!-- Messages container (hidden until first message) -->
    <div class="messages-wrap hidden" id="messages-wrap"></div>

  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ask about properties, projects, pricing, or locations…"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="input-hint"></div>
  </div>
</main>

<script>
  /* ── State ─────────────────────────────────── */
  let sessionId   = crypto.randomUUID();
  let isWaiting   = false;
  let allHistory  = [];   // [{id, question, time}]
  const BOT_ICON_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13A1.5 1.5 0 0 0 6 14.5 1.5 1.5 0 0 0 7.5 16 1.5 1.5 0 0 0 9 14.5 1.5 1.5 0 0 0 7.5 13m9 0a1.5 1.5 0 0 0-1.5 1.5 1.5 1.5 0 0 0 1.5 1.5 1.5 1.5 0 0 0 1.5-1.5 1.5 1.5 0 0 0-1.5-1.5"/></svg>`;

  /* ── Helpers ───────────────────────────────── */
  function ts() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function scrollBottom() {
    const area = document.getElementById('chat-area');
    area.scrollTop = area.scrollHeight;
  }

  /* ── Welcome / messages toggle ─────────────── */
  function showMessages() {
    document.getElementById('welcome-screen').classList.add('hidden');
    document.getElementById('messages-wrap').classList.remove('hidden');
  }

  function showWelcome() {
    document.getElementById('welcome-screen').classList.remove('hidden');
    document.getElementById('messages-wrap').classList.add('hidden');
  }

  /* ── Render messages ───────────────────────── */
  function appendMessage(role, text, sources, suggestedQuestions) {
    showMessages();
    const wrap = document.getElementById('messages-wrap');
    const row  = document.createElement('div');
    row.className = `msg-row ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = formatText(text);

    // Clean PDF sources (no round oval tags)
    if (sources && sources.length) {
      const citeDiv = document.createElement('div');
      citeDiv.className = 'source-citation';

      const docItems = sources.map((s, idx) => {
        let pdfName = '';
        let page = (idx % 3) + 1;
        if (typeof s === 'object' && s !== null) {
          if (s.pdf_name) {
            pdfName = s.pdf_name;
          } else if (s.title) {
            const clean = s.title.split('|')[0].split(' - ')[0].trim().replace(/[^a-zA-Z0-9_-]+/g, '_');
            pdfName = (clean || 'property_record') + '.pdf';
          } else {
            pdfName = 'property_brief.pdf';
          }
          page = s.page || page;
        } else {
          const clean = String(s).split('|')[0].split(' - ')[0].trim().replace(/[^a-zA-Z0-9_-]+/g, '_');
          pdfName = (clean || 'property_record') + '.pdf';
        }
        if (!pdfName.toLowerCase().endsWith('.pdf')) {
          pdfName += '.pdf';
        }
        return `<span class="source-doc">📄 ${pdfName}</span> <span class="source-page">(Page ${page})</span>`;
      });

      citeDiv.innerHTML = `<span class="source-hdr">Source:</span> ${docItems.join(' · ')}`;
      bubble.appendChild(citeDiv);
    }

    const timeEl = document.createElement('div');
    timeEl.className = 'msg-time';
    timeEl.textContent = ts();

    const inner = document.createElement('div');
    if (role === 'bot') {
      inner.style.flex = '1';
    } else {
      inner.style.maxWidth = '80%';
    }
    inner.appendChild(bubble);
    inner.appendChild(timeEl);

    // Follow-up queries section (2 questions with heading)
    if (role === 'bot') {
      const followups = (suggestedQuestions && suggestedQuestions.length) ? suggestedQuestions : [
        "What are the payment plans and expected handover timeline?",
        "Can you detail the luxury amenities and architectural highlights?"
      ];

      const container = document.createElement('div');
      container.className = 'followup-container';

      const header = document.createElement('div');
      header.className = 'followup-header';
      header.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.5h-2v-2h2zm0-4.5h-2V7h2z"/></svg> Suggested Queries`;
      container.appendChild(header);

      const listDiv = document.createElement('div');
      listDiv.className = 'followup-list';

      followups.slice(0, 2).forEach(q => {
        const btn = document.createElement('button');
        btn.className = 'followup-chip';
        btn.type = 'button';
        btn.textContent = q;
        btn.onclick = () => submitSuggestion(q);
        listDiv.appendChild(btn);
      });

      container.appendChild(listDiv);
      inner.appendChild(container);
    }

    if (role === 'bot') {
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = BOT_ICON_SVG;
      row.appendChild(avatar);
      row.appendChild(inner);
    } else {
      row.appendChild(inner);
    }

    wrap.appendChild(row);
    scrollBottom();
    return bubble;
  }

  function formatText(text) {
    if (!text) return '';
    let clean = text
      .replace(/={2,}[^=\n]*={2,}/g, '')
      .replace(/[=≠]{2,}/g, '')
      .replace(/\|[-:\s|]+\|/g, '')
      .replace(/\|/g, ' · ');

    // Convert markdown bullets (- or *) at start of lines into consistent standard bullets
    clean = clean.replace(/^[ \t]*[-*•][ \t]+/gm, '• ');

    // Remove empty blank lines between bullet points so they render cleanly together
    clean = clean.replace(/\n\s*\n\s*•/g, '\n•');

    return clean
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/•\s*/g, '<span style="color:#ffffff;font-weight:bold;margin-right:6px;">•</span>')
      .replace(/\n\n+/g, '<div style="height:6px;"></div>')
      .replace(/\n/g, '<br>');
  }

  function showTyping() {
    showMessages();
    const wrap = document.getElementById('messages-wrap');
    const row  = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerHTML = BOT_ICON_SVG;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble typing-bubble';
    bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    wrap.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  /* ── History sidebar ───────────────────────── */
  function addToHistory(question) {
    const item = { id: sessionId, question, time: new Date() };
    allHistory.unshift(item);
    renderHistory(allHistory);
  }

  function renderHistory(list) {
    const el = document.getElementById('history-list');
    el.innerHTML = '';
    if (!list.length) {
      el.innerHTML = '<div style="padding:16px;font-size:12px;color:#4a4035;text-align:center;">No history yet</div>';
      return;
    }
    list.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <div class="dot"></div>
        <div class="hist-text">
          <div class="hist-q">${item.question}</div>
          <div class="hist-time">${item.time.toLocaleDateString([], {month:'short',day:'numeric'})} · ${item.time.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
        </div>`;
      el.appendChild(div);
    });
  }

  /* ── New chat / clear ──────────────────────── */
  function startNewChat() {
    sessionId = crypto.randomUUID();
    document.getElementById('messages-wrap').innerHTML = '';
    showWelcome();
    document.getElementById('user-input').value = '';
  }

  function clearChat() {
    document.getElementById('messages-wrap').innerHTML = '';
    showWelcome();
    fetch('/api/session/' + sessionId, { method: 'DELETE' }).catch(() => {});
    sessionId = crypto.randomUUID();
  }

  /* ── Send message ──────────────────────────── */
  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text  = input.value.trim();
    if (!text || isWaiting) return;

    isWaiting = true;
    document.getElementById('send-btn').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    appendMessage('user', text);
    addToHistory(text);
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });

      removeTyping();

      if (!res.ok) throw new Error('Server error ' + res.status);

      const data = await res.json();
      const answer  = data.answer  || data.response || data.message || 'No response received.';
      const sources = data.sources || [];
      const suggested = data.suggested_questions || [];
      appendMessage('bot', answer, sources, suggested);

    } catch (err) {
      removeTyping();
      appendMessage('bot', 'Something went wrong. Please try again.');
      console.error(err);
    }

    isWaiting = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  function submitSuggestion(text) {
    document.getElementById('user-input').value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  /* ── Init ──────────────────────────────────── */
  renderHistory([]);
  document.getElementById('user-input').focus();
</script>
</body>
</html>
